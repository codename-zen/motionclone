<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>_smoke</title>
<style>
body{margin:0;padding:32px;font:16px/1.5 system-ui,sans-serif;background:#f5f5f7;color:#1d1d1f}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.item{width:240px;height:48px;margin-bottom:12px;border-radius:8px;background:#fff;animation:rise 600ms cubic-bezier(0.16,1,0.3,1) both}
.item:nth-child(1){animation-delay:100ms}
.item:nth-child(2){animation-delay:180ms}
.item:nth-child(3){animation-delay:260ms}
.item:nth-child(4){animation-delay:340ms}
.hover{width:120px;height:48px;border-radius:8px;background:#d2d2d7;transition:background-color 200ms ease-out}
.hover:hover{background:#2f6fed}
</style>
</head>
<body>
<div class="list">
<div class="item"></div>
<div class="item"></div>
<div class="item"></div>
<div class="item"></div>
</div>
<div class="hover"></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>css-hover-lift</title>
<style>
*{box-sizing:border-box}
:root{--accent:#2f6fed;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--bg:#f5f5f7}
body{margin:0;padding:48px;min-height:800px;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1{margin:0 0 24px;font-size:20px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.card b{color:var(--accent)}
.card{width:320px;height:180px;box-shadow:0 1px 2px rgba(0,0,0,0.06);transition:transform 220ms cubic-bezier(0.2,0.8,0.2,1),box-shadow 220ms cubic-bezier(0.2,0.8,0.2,1)}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 24px rgba(0,0,0,0.12)}
</style>
</head>
<body>
<h1>Hover lift</h1>
<div class="card"><b>Hover me</b></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>expand-in-grid</title>
<style>
  html, body { margin: 0; width: 816px; height: 1080px; overflow: hidden; background: #f4f1ec; font-family: system-ui, sans-serif; color: #2b2233; }
  .header { position: absolute; left: 0; top: 0; width: 816px; height: 300px; }
  .header h1 { position: absolute; left: 46px; top: 110px; margin: 0; font-size: 68px; font-weight: 600; }
  .header p { position: absolute; left: 48px; top: 205px; margin: 0; font-size: 30px; }
  .header .badge { position: absolute; right: 60px; top: 100px; width: 180px; height: 180px; border-radius: 50%; background: conic-gradient(#ff8a3d, #ffd23f, #3ec97a, #ff5c8a, #ff8a3d); }
  .tile { position: absolute; width: 347px; height: 348px; border-radius: 26px; overflow: hidden; }
  .tile b { position: absolute; left: 24px; bottom: 58px; font-size: 32px; font-weight: 600; color: #fff; }
  .tile i { position: absolute; left: 24px; bottom: 24px; font-style: normal; font-size: 22px; color: #fff; }
  .tile .s1, .tile .s2 { position: absolute; border-radius: 50%; }
  .tile.b { left: 424px; top: 336px; background: linear-gradient(135deg, #ff7a59, #ffc94d); }
  .tile.b .s1 { left: 190px; top: 30px; width: 130px; height: 130px; background: #e8455c; }
  .tile.b .s2 { left: 40px; top: 60px; width: 90px; height: 90px; border-radius: 18px; background: #fff3c4; transform: rotate(20deg); }
  .tile.c { left: 46px; top: 712px; background: linear-gradient(160deg, #2fbf8f, #d8ec5a); }
  .tile.c .s1 { left: 200px; top: 40px; width: 110px; height: 110px; background: #ffef7a; }
  .tile.c .s2 { left: 30px; top: 30px; width: 140px; height: 70px; border-radius: 35px; background: #136f55; }
  .tile.d { left: 424px; top: 712px; background: linear-gradient(200deg, #b04cf0, #ff5fa2); }
  .tile.d .s1 { left: 170px; top: 50px; width: 150px; height: 150px; background: #ffd0e4; }
  .tile.d .s2 { left: 40px; top: 40px; width: 80px; height: 80px; border-radius: 12px; background: #5c1f8a; }
  .dim { position: absolute; inset: 0; background: #0e0b14; opacity: 0;
    animation: dim 272ms cubic-bezier(0.25, 0.1, 0.25, 1) 650ms both; }
  @keyframes dim { to { opacity: 0.78; } }

  /* Final rect: left 130, top 336, 556 x 556; scaled from its top edge so the top stays put. */
  .card { position: absolute; left: 130px; top: 336px; width: 556px; height: 556px; border-radius: 40px; overflow: hidden;
    transform-origin: 50% 0; background: #3b78f5;
    animation: grow 310ms cubic-bezier(0.4, 0, 0.2, 1) 640ms both, move 258ms cubic-bezier(0.25, 0.1, 0.25, 1) 674ms both; }
  @keyframes grow { from { scale: 0.624; } to { scale: 1; } }
  @keyframes move { from { translate: -188.5px 0; } to { translate: 0 0; } }
  .card canvas { position: absolute; inset: 0; display: block; }
  .card b { position: absolute; left: 44px; top: 380px; font-size: 64px; font-weight: 600; color: #fff; }
  .card i { position: absolute; left: 46px; top: 466px; font-style: normal; font-size: 34px; color: #fff; }
</style>
</head>
<body>
  <div class="header"><h1>Rewards</h1><p>4 waiting for you</p><div class="badge"></div></div>
  <div class="tile b"><div class="s1"></div><div class="s2"></div><b>Weekend pass</b><i>2 days left</i></div>
  <div class="tile c"><div class="s1"></div><div class="s2"></div><b>Free coffee</b><i>Any size</i></div>
  <div class="tile d"><div class="s1"></div><div class="s2"></div><b>Movie night</b><i>For two</i></div>
  <div class="dim"></div>
  <div class="card">
    <canvas width="556" height="556"></canvas>
    <b>Mystery box</b><i>Tap to open</i>
  </div>
<script>
  const c = document.querySelector("canvas").getContext("2d");
  c.fillStyle = "#2553c4";
  for (let i = 0; i < 36; i++) { c.beginPath(); c.arc((i * 151) % 556, (i * 97) % 340, 12 + (i % 3) * 8, 0, Math.PI * 2); c.fill(); }
  c.lineWidth = 10; c.strokeStyle = "#2553c4";
  for (let x = -556; x < 556; x += 70) { c.beginPath(); c.moveTo(x, 556); c.lineTo(x + 556, 0); c.stroke(); }
</script>
</body>
</html>

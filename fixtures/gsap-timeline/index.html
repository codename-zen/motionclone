<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gsap-timeline</title>
<style>
*{box-sizing:border-box}
:root{--accent:#2f6fed;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--bg:#f5f5f7}
body{margin:0;padding:48px;min-height:800px;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1{margin:0 0 24px;font-size:20px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.card b{color:var(--accent)}
.list{display:grid;gap:16px;width:420px}
.item{height:72px}
</style>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
<h1>GSAP timeline</h1>
<div class="list">
<div class="item card"><b>One</b></div>
<div class="item card"><b>Two</b></div>
<div class="item card"><b>Three</b></div>
</div>
<script>
gsap.timeline().from(".item", { y: 40, opacity: 0, duration: 0.8, ease: "power3.out", stagger: 0.12 }, 0.1);
</script>
</body>
</html>
